name: reels
# Renders AICenter Reels v3 (render.py): script from the site, voice through the site's TTS relay,
# frames with Playwright + web fonts, video with ffmpeg, upload back to the site. Nothing heavy runs on the site.
on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

concurrency: reels

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Speech model cache (Whisper, for caption timing)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small-v1
      - name: Tools (ffmpeg, emoji font, Chromium, Whisper)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-color-emoji libimage-exiftool-perl
          pip install -q playwright faster-whisper
          python -m playwright install --with-deps chromium
      - name: Render and upload
        env:
          SITE_TOKEN: ${{ secrets.SITE_TOKEN }}
        run: python render.py
